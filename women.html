<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<style>
  :root{
    --ink:#141414;
    --paper:#f5f4f0;
    --line:#141414;
    --accent:#ff4d1c;
    --accent-ink:#141414;
  }
 
  *{ box-sizing:border-box; margin:0; padding:0; }
 
  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
 
  /* ===== NAVBAR ===== */
  .navbar{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 18px 40px;
    background:var(--paper);
    border-bottom: 3px solid var(--ink);
  }
 
  .logo{
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    justify-self:start;
  }
  .logo span{ color:var(--accent); }
 
  .nav-center{
    display:flex;
    gap: 48px;
    justify-self:center;
  }
 
  .nav-center a{
    position:relative;
    text-decoration:none;
    color:var(--ink);
    font-weight:700;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 2px;
  }
 
  .nav-center a::after{
    content:"";
    position:absolute;
    left:0; bottom:-2px;
    width:0%;
    height:3px;
    background:var(--accent);
    transition: width .25s ease;
  }
 
  .nav-center a:hover::after{ width:100%; }
 
  .nav-right{
    display:flex;
    gap: 14px;
    justify-self:end;
    align-items:center;
  }
 
  .btn{
    text-decoration:none;
    font-weight:700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    transition: all .2s ease;
  }
 
  .btn-login{
    color:var(--ink);
    background:transparent;
  }
  .btn-login:hover{
    background:var(--ink);
    color:var(--paper);
  }
 
  .btn-signup{
    color:var(--accent-ink);
    background:var(--accent);
    border-color:var(--accent);
  }
  .btn-signup:hover{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
 
  /* mobile */
  @media (max-width: 700px){
    .navbar{
      grid-template-columns: 1fr;
      row-gap: 14px;
      padding: 16px 20px;
    }
    .logo, .nav-center, .nav-right{ justify-self:center; }
    .nav-center{ gap: 28px; }
  }
.navbar a.active {
    color: orange;
    border-bottom: 3px solid orange;
    padding-bottom: 10px;
}

  /* ===== MOVING PHOTO STRIP (right to left, repeats forever) ===== */
  .marquee { width:100%; overflow:hidden; padding:20px 0; border-bottom:3px solid var(--ink); background:var(--paper); }
  .marquee-track { display:flex; gap:14px; width:max-content; animation:slideLeft 30s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state:paused; }
  .marquee-track img { height:220px; width:300px; object-fit:cover; border:2px solid var(--ink); flex-shrink:0; display:block; }
  /* track holds the photos twice, so sliding by half loops seamlessly */
  @keyframes slideLeft { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @media (max-width:480px){ .marquee-track img { height:150px; width:200px; } }

  /* ===== GALLERY (same as men.html) ===== */
  .gallery { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; padding:20px; }
  .gallery-item { border:1px solid #ccc; width:100%; transition:all .2s ease; }
  .gallery-item:hover { border:1px solid var(--accent); box-shadow:0 4px 12px rgba(255,77,28,0.2); }
  .gallery-item img { width:100%; height:40vh; min-height:220px; object-fit:cover; display:block; }
  .gallery-item .desc { padding:12px; text-align:center; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:14px; }
  .gallery-item .buttons { display:flex; gap:8px; padding:0 10px 10px 10px; }
  .gallery-item .buttons form { flex:1; display:flex; }
  .gallery-item .buttons form .btn-item { width:100%; }
  .btn-item { flex:1; text-decoration:none; font-weight:700; font-size:12px; letter-spacing:.5px; text-transform:uppercase; padding:10px 12px; border-radius:4px; border:2px solid var(--ink); cursor:pointer; transition:all .2s ease; text-align:center; display:block; }
  .btn-add-cart { color:var(--ink); background:transparent; }
  .btn-add-cart:hover { background:var(--ink); color:var(--paper); }
  .btn-buy { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .btn-buy:hover { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  @media (max-width:900px){ .gallery{grid-template-columns:repeat(2,1fr);} .gallery-item img{height:32vh;} }
  @media (max-width:480px){ .gallery{grid-template-columns:1fr; padding:12px;} .gallery-item img{height:45vh;} .gallery-item .buttons{flex-direction:column;} }
</style>
</head>
